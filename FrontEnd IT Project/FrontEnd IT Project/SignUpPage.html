<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acadex - Login</title>



    
</head>

<body>

    <!-- =====================================================
         MAIN LOGIN / SIGN UP CONTAINER
         ===================================================== -->

    <main class="auth-container">


        <!-- =================================================
             ACADEX LOGO / BRANDING
             ================================================= -->

        <div class="auth-brand">

            <a href="index.html" class="logo">
                <span class="logo-icon">A</span>
                <span>Acadex</span>
            </a>

            <p>Academic resources. One smarter space.</p>

        </div>


        <!-- =================================================
             LOGIN SECTION
             ================================================= -->

        <section class="login-section">

            <div class="auth-header">

                <h1>Welcome</h1>

                <p>
                    Login to your Acadex account
                </p>

            </div>


            <!-- Login Form -->

            <form class="login-form" action="#" method="post">

                <!-- Email -->

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Remember Me / Forgot Password -->

                <div class="form-options">

                    <label>
                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <!-- Sign Up Link -->

            <div class="auth-switch">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create an account</a>
                </p>

            </div>

        </section>


        <!-- =================================================
             SIGN UP SECTION
             This can also be placed on a separate signup.html
             ================================================= -->

        <section class="signup-section">

            <div class="auth-header">

                <h1>Create Your Account</h1>

                <p>
                    Join Acadex and organise your studies
                </p>

            </div>


            <!-- Sign Up Form -->

            <form class="signup-form" action="#" method="post">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="signup-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signup-name"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Student Email -->

                <div class="form-group">

                    <label for="signup-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Student Number -->

                <div class="form-group">

                    <label for="student-number">
                        Student Number
                    </label>

                    <input
                        type="text"
                        id="student-number"
                        name="student-number"
                        placeholder="Enter your student number"
                    >

                </div>


                <!-- Institution -->

                <div class="form-group">

                    <label for="institution">
                        Institution
                    </label>

                    <input
                        type="text"
                        id="institution"
                        name="institution"
                        placeholder="Enter your institution"
                    >

                </div>


                <!-- Course -->

                <div class="form-group">

                    <label for="course">
                        Course / Degree
                    </label>

                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="Enter your course"
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signup-password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->

                <div class="form-options">

                    <label>

                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >

                        I agree to the Acadex Terms and Conditions

                    </label>

                </div>


                <!-- Sign Up Button -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->

            <div class="auth-switch">

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript can be connected later -->
    <!-- <script src="js/login.js"></script> -->

</body>

</html>
